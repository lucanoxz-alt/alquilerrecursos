<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Definiciones de gradientes -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo elegante -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  
  <!-- Icono principal: Engranaje/Gestión -->
  <g transform="translate(16,16)">
    <!-- Engranaje exterior -->
    <path d="M-8,-2 L-8,-4 L-6,-6 L-4,-6 L-2,-8 L2,-8 L4,-6 L6,-6 L8,-4 L8,-2 L6,0 L8,2 L8,4 L6,6 L4,6 L2,8 L-2,8 L-4,6 L-6,6 L-8,4 L-8,2 L-6,0 Z" 
          fill="url(#iconGrad)" opacity="0.9"/>
    
    <!-- Centro del engranaje -->
    <circle r="4" fill="#ffffff" opacity="0.95"/>
    <circle r="2.5" fill="url(#bgGrad)"/>
    
    <!-- Letra S estilizada -->
    <path d="M-1.5,-2 Q-0.5,-3 0.5,-2 Q1.5,-1 0.5,0 Q-0.5,1 -1.5,0 Q-2.5,-1 -1.5,-2" 
          fill="#ffffff" opacity="0.9" stroke="#4f46e5" stroke-width="0.3"/>
  </g>
  
  <!-- Elementos decorativos -->
  <circle cx="6" cy="6" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="26" cy="6" r="1" fill="#60a5fa" opacity="0.6"/>
  <circle cx="6" cy="26" r="1" fill="#34d399" opacity="0.6"/>
  <circle cx="26" cy="26" r="1.5" fill="#f472b6" opacity="0.7"/>
  
  <!-- Brillo sutil -->
  <ellipse cx="12" cy="8" rx="3" ry="1.5" fill="#ffffff" opacity="0.2"/>
</svg>