############################################
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
############################################

# Nombre interno de la aplicación Spring Boot
# Se usa para logs, monitoreo y Spring Cloud
spring.application.name=alquilerrecursos


############################################
# CONFIGURACIÓN DEL SERVIDOR
############################################

# Puerto donde se ejecuta el backend
# Acceso: http://localhost:8080
server.port=8080


############################################
# CONFIGURACIÓN DE BASE DE DATOS - SQL SERVER
############################################

# URL de conexión JDBC a SQL Server
# localhost:1433  -> servidor y puerto
# databaseName    -> nombre de la base de datos
# encrypt=false   -> desactiva cifrado SSL
# trustServerCertificate=true -> evita errores de certificado
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AlquilerDeVehiculosParaPlaya;encrypt=false;trustServerCertificate=true;

# Usuario de la base de datos
spring.datasource.username=sa

# Contraseña de la base de datos
spring.datasource.password=123

# Driver JDBC de SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


############################################
# CONFIGURACIÓN JPA / HIBERNATE
############################################

# Modo de manejo del esquema de la base de datos
# validate -> solo valida que las tablas existan
# update   -> actualiza tablas automáticamente
# create   -> crea las tablas desde cero
# create-drop -> crea y elimina al apagar
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Dialecto SQL específico para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Formatea el SQL para que sea más legible en consola
spring.jpa.properties.hibernate.format_sql=true

# Evita que Hibernate cambie los nombres de tablas y columnas
# Usa exactamente los nombres definidos en las entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


############################################
# CONFIGURACIÓN DE FECHA Y HORA
############################################

# Zona horaria para serialización JSON (Perú)
# Evita desfases de horas en fechas
spring.jackson.time-zone=America/Lima


############################################
# CONFIGURACIÓN JWT (SEGURIDAD)
############################################

# Clave secreta para firmar y validar los tokens JWT
# Debe ser larga y segura (no exponer en producción)
jwt.secret=QWERTYUIOPASDFGHJKLZXCVBNM1234567890qwertyuiopasdfghjklzxcvbnm123456

# Tiempo de expiración del token JWT
# 86400000 ms = 24 horas (1 día)
jwt.expiration=86400000


# DATOS DE LA EMPRESA (PROPIEDADES PERSONALIZADAS)

empresa.nombre=AlquilerPlaya
empresa.ruc=20123456789
empresa.direccion=Av. La Marina 123, Chorrillos, Lima
empresa.telefono=+51 999 888 777
empresa.email=ventas@alquilerplaya.com

# URL del logo (para PDFs, reportes, etc.)
empresa.logoUrl=
# Tasa de IGV parametrizable
empresa.igv-rate=0.18
