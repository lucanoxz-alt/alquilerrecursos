spring.application.name=alquilerrecursos

# Puerto del servidor
server.port=8080

# Conexión a SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AlquilerDeVehiculosParaPlaya;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (propiedades personalizadas)
jwt.secret=QWERTYUIOPASDFGHJKLZXCVBNM1234567890qwertyuiopasdfghjklzxcvbnm123456
jwt.expiration=86400000 
# 1 día en milisegundos
# Desactiva la estrategia de nomenclatura de Spring Boot
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Datos de la empresa
empresa.nombre=AlquilerPlaya
empresa.ruc=20123456789
empresa.direccion=Av. La Marina 123, Chorrillos, Lima
empresa.telefono=+51 999 888 777
empresa.email=ventas@alquilerplaya.com
empresa.logoUrl=
