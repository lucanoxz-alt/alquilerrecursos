<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Turistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Turistas Registrados</h2>
    <a href="/turistas/nuevo" class="btn btn-primary mb-3">Registrar Nuevo</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Nacionalidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="turista : ${turistas}">
                <td th:text="${turista.id}"></td>
                <td th:text="${turista.nombre}"></td>
                <td th:text="${turista.documentoIdentidad}"></td>
                <td th:text="${turista.nacionalidad}"></td>
                <td>
                    <a th:href="@{/turistas/editar/{id}(id=${turista.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/turistas/eliminar/{id}(id=${turista.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
